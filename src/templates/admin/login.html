{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<h2>Admin Login</h2>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <p class="flash-error">{{ messages[0] }}</p>
  {% endif %}
{% endwith %}
<form method="post" class="admin-form admin-login-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Password<br>
    <input type="password" name="password" autofocus class="form-control admin-login-password">
  </label>
  <br><br>
  <button type="submit" class="admin-primary-btn">Log in</button>
</form>
{% endblock %}
